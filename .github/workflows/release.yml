name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          EGG_TIMER_KEYSTORE: ${{ runner.temp }}/release.jks
          EGG_TIMER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EGG_TIMER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EGG_TIMER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK after the tag
        run: |
          cp app/build/outputs/apk/release/app-release.apk "egg-timer-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "egg-timer-${GITHUB_REF_NAME}.apk" \
            --title "Egg Timer ${GITHUB_REF_NAME}" \
            --generate-notes
